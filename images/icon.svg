<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cf6a"/>
      <stop offset="1" stop-color="#b47a24"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb544"/>
      <stop offset="1" stop-color="#3e8a2f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa3e6"/>
      <stop offset="1" stop-color="#1f6fb8"/>
    </linearGradient>
    <clipPath id="map">
      <path d="M36 50Q128 24 220 50V128C220 182 178 214 128 230C78 214 36 182 36 128Z"/>
    </clipPath>
  </defs>

  <!-- shield badge -->
  <path d="M16 34Q128 2 240 34V128C240 194 190 232 128 250C66 232 16 194 16 128Z"
        fill="url(#rim)" stroke="#2a1a0e" stroke-width="8" stroke-linejoin="round"/>

  <!-- top-down map tile -->
  <g clip-path="url(#map)">
    <rect x="30" y="20" width="196" height="216" fill="url(#land)"/>
    <!-- sand banks, then water channel -->
    <path d="M140 14C120 80 180 120 150 244" fill="none" stroke="#e9d594" stroke-width="46"/>
    <path d="M140 14C120 80 180 120 150 244" fill="none" stroke="url(#water)" stroke-width="32"/>

    <!-- main navmesh -->
    <polygon points="60,78 104,62 116,168 66,150" fill="#fff4c8" fill-opacity="0.28"/>
    <g fill="none" stroke="#fff4c8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="60,78 104,62 116,168 66,150"/>
      <path d="M60 78L88 116L104 62M66 150L88 116L116 168"/>
    </g>
    <g fill="#fff4c8" stroke="#2a1a0e" stroke-width="3">
      <circle cx="60" cy="78" r="8"/>
      <circle cx="104" cy="62" r="8"/>
      <circle cx="88" cy="116" r="8"/>
      <circle cx="66" cy="150" r="8"/>
      <circle cx="116" cy="168" r="8"/>
    </g>

    <!-- disconnected island across the water, ringed in red -->
    <polygon points="191,76 207,102 175,102" fill="#fff4c8" stroke="#2a1a0e" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="191" cy="92" r="28" fill="none" stroke="#2a1a0e" stroke-width="15"/>
    <circle cx="191" cy="92" r="28" fill="none" stroke="#ee3b2b" stroke-width="9"/>
  </g>

  <!-- inner frame -->
  <path d="M36 50Q128 24 220 50V128C220 182 178 214 128 230C78 214 36 182 36 128Z"
        fill="none" stroke="#2a1a0e" stroke-width="6" stroke-linejoin="round"/>
</svg>
